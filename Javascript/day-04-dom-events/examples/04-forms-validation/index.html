<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forms and Validation</title>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="container">
        <h1>Create Account</h1>

        <form id="registration-form" novalidate>
            <div class="field">
                <label for="name">Name:</label>

                <input
                    id="name"
                    name="name"
                    type="text"
                    minlength="2"
                    required
                >

                <p
                    id="name-error"
                    class="error"
                    aria-live="polite"
                ></p>
            </div>

            <div class="field">
                <label for="email">Email:</label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    required
                >

                <p
                    id="email-error"
                    class="error"
                    aria-live="polite"
                ></p>
            </div>

            <div class="field">
                <label for="password">Password:</label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    minlength="8"
                    required
                >

                <p
                    id="password-error"
                    class="error"
                    aria-live="polite"
                ></p>
            </div>

            <div class="field">
                <label for="role">Role:</label>

                <select id="role" name="role">
                    <option value="student">Student</option>
                    <option value="developer">Developer</option>
                </select>
            </div>

            <div class="field checkbox-field">
                <input
                    id="terms"
                    name="terms"
                    type="checkbox"
                >

                <label for="terms">
                    I accept the terms
                </label>

                <p
                    id="terms-error"
                    class="error"
                    aria-live="polite"
                ></p>
            </div>

            <button type="submit">
                Register
            </button>

            <button type="reset">
                Clear
            </button>
        </form>

        <p id="form-status" aria-live="polite"></p>
    </main>
</body>
</html>
