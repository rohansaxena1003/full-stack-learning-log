<!-- 8. Complete practical example -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DOM Selection</title>

    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1 id="page-title">Task Manager</h1>
        <p class="subtitle">Learn DOM selection</p>
    </header>

    <main id="app">
        <section class="task-section">
            <h2>My Tasks</h2>

            <ul id="task-list">
                <li class="task" data-status="active">
                    Study DOM
                </li>

                <li class="task" data-status="completed">
                    Practise JavaScript
                </li>

                <li class="task" data-status="active">
                    Build Task Tracker
                </li>
            </ul>
        </section>
    </main>

    <footer>
        <p>Day 4 JavaScript</p>
    </footer>
</body>
</html>
